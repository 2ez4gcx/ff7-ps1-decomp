# splat configuration for the main executable of Final Fantasy VII (USA, disc 1).
# The executable itself is never part of this repository: tools/extract_disc.py
# copies it from the player's disc into disks/us/.
name: SCUS_941.63
sha1: a95e8b16b97071203b953bb81a33980509262f30
options:
  basename: scus_941.63
  target_path: disks/us/SCUS_941.63
  elf_path: build/us/scus_941.63.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/main
  src_path: src/main
  build_path: build/us
  ld_script_path: build/us/scus_941.63.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False
  # GCC 2.6.3 puts top-level asm ahead of the functions around it; this
  # INCLUDE_ASM wraps each in a function maspsx unwraps, keeping the order.
  include_asm_macro_style: maspsx_hack

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.main.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.main.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.main.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    subsegments:
      - [0x800, .rodata, text]
      - [0x900, .rodata, text2]
      - [0x958, .rodata, text3]
      - [0xA9C, .rodata, text4]
      - [0xB94, .rodata, akao]
      - [0xCB4, .rodata, lib]
      # The game's code, in parts built differently (tools/psyq.py FILE_OPTIONS):
      # text2 and text4 with GCC 2.7.2, text2 with a newer ASPSX too.
      - [0x18B8, c, text]
      - [0x449C, c, text2]
      - [0x7790, c, text3]
      - [0xC5B0, c, text4]
      # The AKAO sound driver and the PSY-Q libraries were built without $gp (-G0).
      - [0x1A250, c, akao]
      - [0x26A98, c, lib]
      - [0x39518, data, data]
  - [0x61000]
