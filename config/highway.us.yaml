# splat configuration for MINI/HIGHWAY.BIN of Final Fantasy VII (USA, disc 1), loaded at
# 0x800a0000 (unpacked from its gzip stream). Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: highway
sha1: bc0d4793380d2aa5715e971befb49add8ef7829a
options:
  basename: highway
  target_path: disks/us/unpacked/MINI/HIGHWAY.BIN
  elf_path: build/us/highway.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/highway
  src_path: src/highway
  build_path: build/us
  ld_script_path: build/us/highway.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False
  # GCC 2.6.3 puts top-level asm ahead of the functions around it; this
  # INCLUDE_ASM wraps each in a function maspsx unwraps, keeping the order.
  include_asm_macro_style: maspsx_hack

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.highway.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.highway.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.highway.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.highway.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: highway
    type: code
    start: 0x0
    vram: 0x800a0000
    # file header: unpacked 0x14f4c, second word 0x6176c
    subsegments:
      - [0x0, .rodata, text]
      - [0xd0, c, text]
      - [0x141c8, data, data]
  - [0x14f4c]
