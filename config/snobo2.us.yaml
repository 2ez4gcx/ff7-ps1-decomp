# splat configuration for MINI/SNOBO2.BIN of Final Fantasy VII (USA, disc 1), loaded at
# 0x800a0000 (unpacked from its gzip stream). Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: snobo2
sha1: 5ed8e6f3cbef1a1eec0f6b8543a34efe80d9c43b
options:
  basename: snobo2
  target_path: disks/us/unpacked/MINI/SNOBO2.BIN
  elf_path: build/us/snobo2.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/snobo2
  src_path: src/snobo2
  build_path: build/us
  ld_script_path: build/us/snobo2.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False
  # GCC 2.6.3 puts top-level asm ahead of the functions around it; this
  # INCLUDE_ASM wraps each in a function maspsx unwraps, keeping the order.
  include_asm_macro_style: maspsx_hack

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.snobo2.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.snobo2.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.snobo2.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.snobo2.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: snobo2
    type: code
    start: 0x0
    vram: 0x800a0000
    # file header: unpacked 0x418f4, second word 0x252bc
    subsegments:
      - [0x0, .rodata, text]
      - [0x448, c, text]
      - [0x18260, data, data]
  - [0x418f4]
