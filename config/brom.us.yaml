# splat configuration for BATTLE/BROM.X of Final Fantasy VII (USA, disc 1), loaded at
# 0x800a0000 (unpacked from its gzip stream). Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: brom
sha1: ebc7a6559f677d1caef8c5db5fd884fd9e0ab156
options:
  basename: brom
  target_path: disks/us/unpacked/BATTLE/BROM.X
  elf_path: build/us/brom.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/brom
  src_path: src/brom
  build_path: build/us
  ld_script_path: build/us/brom.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.brom.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.brom.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.brom.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.brom.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: brom
    type: code
    start: 0x0
    vram: 0x800a0000
    # file header: unpacked 0x6cc, second word 0x4078
    subsegments:
      - [0x0, asm, text]
      - [0x6b4, data, data]
  - [0x6cc]
