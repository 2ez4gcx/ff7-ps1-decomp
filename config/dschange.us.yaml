# splat configuration for FIELD/DSCHANGE.X of Final Fantasy VII (USA, disc 1), loaded at
# 0x800a0000. Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: dschange
sha1: e884441c5ceacdeb94e16a603b73ca53706078e8
options:
  basename: dschange
  target_path: disks/us/FIELD/DSCHANGE.X
  elf_path: build/us/dschange.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/dschange
  src_path: src/dschange
  build_path: build/us
  ld_script_path: build/us/dschange.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.dschange.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.dschange.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.dschange.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.dschange.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: dschange
    type: code
    start: 0x0
    vram: 0x800a0000
    subsegments:
      - [0x0, asm, text]
      - [0x1580, data, data]
  - [0x1774]
