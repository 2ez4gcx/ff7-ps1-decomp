# splat configuration for BATTLE/BATINI.X of Final Fantasy VII (USA, disc 1), loaded at
# 0x801b0000 (unpacked from its gzip stream). Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: batini
sha1: 2771b06f7249d34ed8a4f8c94e6047f70278e17c
options:
  basename: batini
  target_path: disks/us/unpacked/BATTLE/BATINI.X
  elf_path: build/us/batini.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/batini
  src_path: src/batini
  build_path: build/us
  ld_script_path: build/us/batini.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.batini.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.batini.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.batini.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.batini.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: batini
    type: code
    start: 0x0
    vram: 0x801b0000
    # file header: unpacked 0x27b4, second word 0x0
    subsegments:
      - [0x0, rodata, rodata]
      - [0x50, asm, text]
  - [0x27b4]
