# splat configuration for MENU/EQIPMENU.MNU of Final Fantasy VII (USA, disc 1), loaded at
# 0x801d0000. Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: eqipmenu
sha1: ed5414ae8376e2c1f982a8d43bd22e0df9b26ba7
options:
  basename: eqipmenu
  target_path: disks/us/MENU/EQIPMENU.MNU
  elf_path: build/us/eqipmenu.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/eqipmenu
  src_path: src/eqipmenu
  build_path: build/us
  ld_script_path: build/us/eqipmenu.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.eqipmenu.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.eqipmenu.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.eqipmenu.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.eqipmenu.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: eqipmenu
    type: code
    start: 0x0
    vram: 0x801d0000
    subsegments:
      - [0x0, rodata, rodata]
      - [0x124, asm, text]
      - [0x82a4, data, data]
  - [0x1778c]
