# splat configuration for MINI/JET.BIN of Final Fantasy VII (USA, disc 1), loaded at
# 0x800a0000 (unpacked from its gzip stream). Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: jet
sha1: 46a9f4dd9071786adedc169b0e5463874b1f965a
options:
  basename: jet
  target_path: disks/us/unpacked/MINI/JET.BIN
  elf_path: build/us/jet.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/jet
  src_path: src/jet
  build_path: build/us
  ld_script_path: build/us/jet.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.jet.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.jet.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.jet.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.jet.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: jet
    type: code
    start: 0x0
    vram: 0x800a0000
    # file header: unpacked 0x8918, second word 0x45b18
    subsegments:
      - [0x0, rodata, rodata]
      - [0x450, asm, text]
  - [0x8918]
