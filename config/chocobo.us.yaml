# splat configuration for MINI/CHOCOBO.BIN of Final Fantasy VII (USA, disc 1), loaded at
# 0x800a0000 (unpacked from its gzip stream). Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: chocobo
sha1: d5ada4f6281dcaec86005dd4429a1f18240f752a
options:
  basename: chocobo
  target_path: disks/us/unpacked/MINI/CHOCOBO.BIN
  elf_path: build/us/chocobo.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/chocobo
  src_path: src/chocobo
  build_path: build/us
  ld_script_path: build/us/chocobo.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False
  # GCC 2.6.3 puts top-level asm ahead of the functions around it; this
  # INCLUDE_ASM wraps each in a function maspsx unwraps, keeping the order.
  include_asm_macro_style: maspsx_hack

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.chocobo.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.chocobo.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.chocobo.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.chocobo.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: chocobo
    type: code
    start: 0x0
    vram: 0x800a0000
    # file header: unpacked 0x1733c, second word 0x3ddec
    subsegments:
      - [0x0, .rodata, text]
      - [0x34, .rodata, text2]
      - [0x68, .rodata, text3]
      - [0x294, .rodata, text4]
      - [0x2d0, c, text]
      - [0x3308, c, text2]
      - [0x7924, c, text3]
      - [0xBABC, c, text4]
      - [0xD9D8, c, text4b]
      - [0x11250, data, data]
  - [0x1733c]
