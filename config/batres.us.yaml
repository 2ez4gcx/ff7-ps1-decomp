# splat configuration for BATTLE/BATRES.X of Final Fantasy VII (USA, disc 1), loaded at
# 0x801b0000 (unpacked from its gzip stream). Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: batres
sha1: e7ae9182df1c8ee457bae5bf7d7dc63c61a8c3d8
options:
  basename: batres
  target_path: disks/us/unpacked/BATTLE/BATRES.X
  elf_path: build/us/batres.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/batres
  src_path: src/batres
  build_path: build/us
  ld_script_path: build/us/batres.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.batres.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.batres.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.batres.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.batres.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: batres
    type: code
    start: 0x0
    vram: 0x801b0000
    # file header: unpacked 0x193c, second word 0x4
    subsegments:
      - [0x0, asm, text]
  - [0x193c]
