# splat configuration for MINI/SUBMAR.BIN of Final Fantasy VII (USA, disc 1), loaded at
# 0x800a0000 (unpacked from its gzip stream). Made by tools/new_overlay.py; the overlay itself is
# never part of this repository.
name: submar
sha1: a8a28632ca5631567259ec57cc2257751e867f76
options:
  basename: submar
  target_path: disks/us/unpacked/MINI/SUBMAR.BIN
  elf_path: build/us/submar.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/us/submar
  src_path: src/submar
  build_path: build/us
  ld_script_path: build/us/submar.ld
  ld_dependencies: False
  # PSY-Q's linker packs sections back to back.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  # .bss gets its own section, so its alignment never pads the image.
  ld_bss_is_noload: True

  find_file_boundaries: True
  gp_value: 0x80062D44

  o_as_suffix: True
  use_legacy_include_asm: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.us.main.txt
    - config/symbols.us.submar.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.submar.txt
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.submar.txt
  undefined_syms_auto_path: build/us/undefined_syms_auto.submar.txt

  subalign: 2

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: submar
    type: code
    start: 0x0
    vram: 0x800a0000
    # file header: unpacked 0x12e38, second word 0x112d48
    subsegments:
      - [0x0, rodata, rodata]
      - [0xbc, asm, text]
      - [0xd330, data, data]
  - [0x12e38]
